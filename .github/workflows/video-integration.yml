name: Real FFmpeg export integration
on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/video-integration.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run actual video renders
        run: python -m unittest discover -s tests -p 'test_video_integration.py' -v
