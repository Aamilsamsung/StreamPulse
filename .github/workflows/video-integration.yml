name: Real FFmpeg export integration
on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/video-integration.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install application and transcription dependencies
        run: pip install -r requirements-dev.txt -r requirements-ai.txt
      - name: Run uploads, transcription and video exports
        env:
          HF_HUB_DISABLE_XET: '1'
          TEST_WHISPER: '1'
        run: python -m unittest discover -s tests -v
